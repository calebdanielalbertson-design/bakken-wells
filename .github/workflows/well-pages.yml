name: Well pages

# Builds one static page per North Dakota well from the public NDIC/DMR GIS download and
# publishes the result to this repository's GitHub Pages site.
#   - daily on a schedule (DMR regenerates the wells layer every morning, about 09:15 UTC;
#     a scheduled run that finds the same archives, unit data and generator as the live
#     site stops after the download instead of redeploying 70,000 unchanged pages)
#   - on demand from the Actions tab (optionally without deploying)
#   - after changes to the generator land on main
#   - on pull requests that touch the generator (build and report only, no deploy)
#
# DMR downloads stay outside Central business hours (07:00-18:00, Monday to Friday;
# scripts/wells/hours.py). GitHub can start a scheduled run hours late (the 10:27 UTC run
# has started around 16:30 UTC, mid-morning Central), so the time is checked when the run
# starts. A run that lands in business hours runs the tests and downloads nothing; the
# evening schedule (00:47 UTC, 18:47 CST / 19:47 CDT) then picks up the day's layer, or a
# generator change pushed during the day (changed.py compares the generator commit). A
# manual run may go ahead anyway with "during_business_hours"; a pull request opened during
# business hours runs the tests only, so re-run it after 18:00 Central to see the build.

on:
  schedule:
    - cron: '27 10 * * *'
    - cron: '47 0 * * *'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to GitHub Pages after building
        type: boolean
        default: true
      during_business_hours:
        description: Download from DMR even during Central business hours (07:00-18:00, Mon-Fri)
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'scripts/wells/**'
      - '.github/workflows/well-pages.yml'
  pull_request:
    paths:
      - 'scripts/wells/**'
      - '.github/workflows/well-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: well-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Fetch DMR data and build pages
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      skip: ${{ steps.hours.outputs.defer == 'true' || steps.changed.outputs.unchanged == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Every step that reaches DMR (and the build that needs its download) waits while this says defer.
      - name: Check Central business hours
        id: hours
        run: |
          python scripts/wells/hours.py \
            --override "${{ github.event_name == 'workflow_dispatch' && inputs.during_business_hours }}" \
            --github-output "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Decide the public base URL
        id: base
        env:
          CONFIGURED: ${{ vars.WELLS_BASE_URL }}
        run: |
          if [ -n "$CONFIGURED" ]; then
            base="${CONFIGURED%/}"
          else
            base="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          fi
          echo "url=$base" >> "$GITHUB_OUTPUT"
          echo "Base URL: $base"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tests (shapefile reader, builder, fixtures, units and orders, search)
        run: |
          python -m unittest discover -s scripts/tests -p 'test_*.py'
          node tests/test_well_search.mjs
          node tests/test_production.mjs
          node tests/test_compare.mjs

      - name: List archives on the DMR download page
        if: steps.hours.outputs.defer != 'true'
        run: python scripts/wells/fetch_dmr.py --list || echo "::warning::Could not list the DMR download page"

      - name: Download the wells archive
        if: steps.hours.outputs.defer != 'true'
        run: python scripts/wells/fetch_dmr.py --out work/dmr

      - name: Inspect the layers' columns
        if: steps.hours.outputs.defer != 'true'
        run: |
          for archive in work/dmr/*.zip; do
            python scripts/wells/build_well_pages.py --inspect "$archive" || echo "::warning::Could not inspect $archive"
          done

      # Spacing units, membership and order history, and the per-well production feed built from
      # NDIC's free Monthly Production Reports, come from the pipeline repository as assets of the
      # "well-index-data" release on this repository (see README). Without them the build still
      # succeeds: the well pages simply have no "Spacing units" or "Production" panel.
      - name: Fetch the spacing-unit, order and production data
        id: data
        if: steps.hours.outputs.defer != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/data
          args=""
          if gh release download well-index-data --repo "$GITHUB_REPOSITORY" --pattern 'well-index-data.json.gz' --dir work/data; then
            args="$args --data work/data/well-index-data.json.gz"
          else
            echo "::warning::No well-index-data asset; building without spacing units and orders"
          fi
          if gh release download well-index-data --repo "$GITHUB_REPOSITORY" --pattern 'well-production.json.gz' --dir work/data; then
            args="$args --production work/data/well-production.json.gz"
          else
            echo "::warning::No well-production asset; building without production panels"
          fi
          ls -l work/data || true
          echo "args=${args# }" >> "$GITHUB_OUTPUT"

      # On the daily schedule only: stop here when DMR's archives, the unit data and the generator
      # are the ones the live site was built from. Pushes and manual runs always build and deploy.
      - name: Compare with the live site
        id: changed
        if: github.event_name == 'schedule' && steps.hours.outputs.defer != 'true'
        run: |
          python scripts/wells/changed.py \
            --live "${{ steps.base.outputs.url }}/build.json" \
            --provenance work/dmr/download-provenance.json \
            --generator "$GITHUB_SHA" \
            $(test -f work/data/well-index-data.json.gz && echo "--data work/data/well-index-data.json.gz") \
            $(test -f work/data/well-production.json.gz && echo "--production work/data/well-production.json.gz") \
            --github-output "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build the pages
        if: steps.hours.outputs.defer != 'true' && steps.changed.outputs.unchanged != 'true'
        env:
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}   # Search Console HTML-tag proof; empty = no tag
        run: |
          python scripts/wells/build_well_pages.py \
            --source work/dmr \
            --out work/wells-site \
            --base-url "${{ steps.base.outputs.url }}" \
            --generator "$GITHUB_SHA" \
            --summary work/build-summary.md ${{ steps.data.outputs.args }}
          cat work/build-summary.md >> "$GITHUB_STEP_SUMMARY"
          cat work/build-summary.md

      - name: Keep the build report
        if: steps.hours.outputs.defer != 'true' && steps.changed.outputs.unchanged != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: well-pages-report
          path: |
            work/wells-site/build.json
            work/dmr/download-provenance.json
          retention-days: 90

      # Same tarball actions/upload-pages-artifact would build, minus its per-file log line
      # (tens of thousands of them), so the column report above stays readable in the log.
      - name: Package for GitHub Pages
        if: steps.hours.outputs.defer != 'true' && steps.changed.outputs.unchanged != 'true'
        run: tar --dereference --hard-dereference --directory work/wells-site --exclude=.git --exclude=.github -cf "$RUNNER_TEMP/artifact.tar" .

      - uses: actions/upload-artifact@v4
        if: steps.hours.outputs.defer != 'true' && steps.changed.outputs.unchanged != 'true'
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.skip != 'true' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - id: deployment
        uses: actions/deploy-pages@v4
